[workspace]
resolver = "2"
members = ["nookery-core", "nookery-save", "nookery-config", "nookery-famicom"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
