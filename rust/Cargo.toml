[workspace]
resolver = "2"
members = ["nookery-core", "nookery-save", "nookery-input", "nookery-config", "nookery-famicom", "nookery-bswap", "nookery-arena", "nookery-disc", "nookery-texture", "nookery-data-ffi", "nookery-social-proto", "nookery-social-model", "nookery-runtime", "nookery-game", "nookery-graph", "nookery-social-persistence", "nookery-social-server"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Cargo does not permit `panic` in a package-specific profile. The runtime's
# exported FFI boundary catches callback panics, so release must retain unwind
# support for the workspace build that contains it.
panic = "unwind"
strip = "symbols"

[profile.dev]
opt-level = 1
