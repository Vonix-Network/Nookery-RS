[workspace]
resolver = "2"
members = ["nookery-core", "nookery-save", "nookery-input", "nookery-config", "nookery-famicom", "nookery-bswap", "nookery-arena", "nookery-disc", "nookery-texture", "nookery-data-ffi", "nookery-social-proto", "nookery-social-model", "nookery-runtime", "nookery-social-persistence", "nookery-social-server"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
