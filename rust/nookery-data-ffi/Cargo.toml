[package]
name = "nookery-data-ffi"
version = "0.1.0"
description = "C ABI adapter candidate over nookery-core data-folder primitives"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "nookery_data_ffi"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
nookery-core = { path = "../nookery-core" }
