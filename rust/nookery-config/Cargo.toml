[package]
name = "nookery-config"
version = "0.1.0"
description = "Settings model ported from Nookery pc/src/acgc_settings.cpp"
# Values copied from rust/Cargo.toml [workspace.package]. That workspace is owned
# by the core lane and does not list this member, so this crate is its own root.
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1"

# Standalone crate: the sibling workspace (rust/Cargo.toml) is owned elsewhere and
# does not list this member, so this manifest declares its own workspace root.
[workspace]
